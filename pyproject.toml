[project]
name = "slidedown"
version = "1.2.1"
description = "Text-first presentation compiler with behavioral markup"
authors = [
    {name = "Rudolph Pienaar", email = "rudolph.pienaar@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["presentation", "slides", "compiler", "markup", "latex-inspired"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup",
]

dependencies = [
    "chris_plugin>=0.4.0",
    "pyfiglet>=1.0.2",
    "cowsay>=6.1",
    "loguru>=0.7.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pygments>=2.17.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/FNNDSC/slidedown"
Documentation = "https://slidedown.readthedocs.io"
Repository = "https://github.com/FNNDSC/slidedown"
Issues = "https://github.com/FNNDSC/slidedown/issues"

[project.scripts]
slidedown = "slidedown.__main__:main"

[tool.setuptools.package-data]
slidedown = ["assets/**/*"]

[tool.setuptools.data-files]
"share/slidedown/themes/default" = [
    "themes/default/theme.css",
    "themes/default/theme.yaml",
]
"share/slidedown/themes/conventional-light" = [
    "themes/conventional-light/theme.css",
    "themes/conventional-light/theme.yaml",
]
"share/slidedown/themes/terminal" = [
    "themes/terminal/theme.css",
    "themes/terminal/theme.yaml",
]
"share/slidedown/themes/retro-terminal" = [
    "themes/retro-terminal/theme.css",
    "themes/retro-terminal/theme.yaml",
]
"share/slidedown/themes/lcars-lower-decks" = [
    "themes/lcars-lower-decks/theme.css",
    "themes/lcars-lower-decks/theme.yaml",
    "themes/lcars-lower-decks/slidedown-lcars-adapter.css",
]
"share/slidedown/themes/lcars-lower-decks/templates" = [
    "themes/lcars-lower-decks/templates/lcars-data-cascade.html",
    "themes/lcars-lower-decks/templates/lcars-frame.html",
    "themes/lcars-lower-decks/templates/lcars-scripts.js",
    "themes/lcars-lower-decks/templates/slidedown-lcars-cascade.js",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "slidedown",
    "slidedown.config",
    "slidedown.lib",
    "slidedown.models",
]
package-dir = {"slidedown" = "src"}

[tool.black]
line-length = 79
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--verbose",
    "--cov=slidedown",
    "--cov-report=html",
    "--cov-report=term-missing",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "chris_plugin",
    "cowsay",
    "pygments",
    "pygments.*",
    "yaml",
]
ignore_missing_imports = true

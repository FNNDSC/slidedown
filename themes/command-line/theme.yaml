name: "Command Line"
description: "Terminal windows, typed commands, a cursor that follows the output"
author: "slidedown team"
version: "1.0"

# Color palette - modern terminal colors
colors:
  background: "#1e1e1e"
  foreground: "#d4d4d4"
  accent: "#4ec9b0"
  code_bg: "#252526"

# Typography - modern monospace fonts
fonts:
  body:
    family: "'Fira Code', 'JetBrains Mono', 'Consolas', monospace"
    size: "28px"
    line_height: "1.5"
  code:
    family: "'Fira Code', 'JetBrains Mono', 'Consolas', monospace"
    size: "24px"

# Layout
layout:
  slide_padding: "50px"
  viewport_width: "2560px"
  viewport_height: "1440px"

# Header/Footer
header:
  enabled: false

footer:
  enabled: true
  height: "60px"
  show_navigation: true
  show_page_numbers: false

# Navigation buttons
navigation:
  button_style: "square"
  position: "bottom-right"

# Slide master
slide_master:
  background:
    color: "#1e1e1e"
  watermarks: []

# Code highlighting
code:
  pygments_style: "monokai"
  show_line_numbers: true

# Effects
effects:
  typewriter_speed: 40

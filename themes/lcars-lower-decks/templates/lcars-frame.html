    <section class="wrap-all">
    <div class="lcars-scanline"></div>
        <div class="wrap">
            <div class="scroll-top"><a id="scroll-top" href="#" onclick="scrollToTop(); return false;"><span class="hop">screen</span> top</a></div>
            <div class="left-frame-top" id="top-frame">
                <div class="panel-1" id="lcars-telemetry-bank">
                    <div class="telemetry-wrapper">
                        <div class="tele-col">
                            <div class="tele-header">SYS: STATUS</div>
                            <div class="tele-content" id="tele-sys"></div>
                        </div>
                        <div class="tele-col">
                            <div class="tele-header">NET: TRAFFIC</div>
                            <div class="tele-content" id="tele-net"></div>
                        </div>
                        <div class="tele-col">
                            <div class="tele-header">PROC: LOG</div>
                            <div class="tele-content" id="tele-log"></div>
                        </div>
                    </div>
                </div>
                <div class="panel-2">SLIDE <span class="hop navbar-counter" data-template="{{current}} / {{total}}">1 / {slide_count}</span></div>
            </div>
            <div class="right-frame-top">
                <div class="banner">
                    <div id="lcars-nerd-graphic" style="width: 120px; height: 100%; margin-right: 20px; display: flex; align-items: center; justify-content: center;"></div>
                    <span id="pageTitle">{title}</span>
                    <div class="lcars-data-bank">
                        <span class="lcars-flicker">-8812</span>
                        <span class="lcars-flicker">-4402</span>
                        <span class="lcars-flicker">-9912</span>
                    </div>
                </div>
                <div class="data-cascade-button-group">{cascade_html}
                    <div class="lcars-nav-flicker">
                        <span class="lcars-flicker">-1024</span>
                        <span class="lcars-flicker">-512</span>
                    </div>
                    <nav>
                        <button onclick="page.advance_toPrevious()">01</button>
                        <button onclick="page.advance_toNext()">02</button>
                        <button onclick="page.advance_toFirst()">03</button>
                        <button onclick="page.advance_toLast()">04</button>
                    </nav>
                </div>
                <div class="bar-panel first-bar-panel">
                    <div class="bar-1"></div>
                    <div class="bar-2"></div>
                    <div class="bar-3"></div>
                    <div class="bar-4"></div>
                    <div class="bar-5"></div>
                </div>
            </div>
        </div>
        <div class="wrap" id="gap">
            <div class="left-frame">
                <button onclick="toggleTopFrame(event)" id="topBtn" class="panel-button"><span class="hop">show</span> detail</button>
                <div>
                    <div class="panel-3">03<span class="hop lcars-flicker">-111968</span></div>
                    <div class="panel-4">04<span class="hop lcars-flicker">-41969</span></div>
                    <div class="panel-5">05<span class="hop lcars-flicker">-1701D</span></div>
                    <div class="panel-6">06<span class="hop lcars-flicker">-081966</span></div>
                </div>
                <div>
                    <div class="panel-7">07<span class="hop">-{slide_count:02d}</span></div>
                </div>
            </div>
            <div class="right-frame">
                <div class="bar-panel">
                    <div class="bar-6"></div>
                    <div class="bar-7"></div>
                    <div class="bar-8"></div>
                    <div class="bar-9"></div>
                    <div class="bar-10"></div>
                </div>
                <main>
                    {content}
                </main>
            </div>
        </div>
    </section>

    <script src="js/lcars-scripts.js"></script>
